name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      agent_runtime: ${{ steps.filter.outputs.agent_runtime }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import PurePosixPath

          groups = {
              "backend": [
                  "backend/**",
                  "dominos_pakistan_menu_import.json",
                  ".github/workflows/deploy-backend.yml",
              ],
              "agent_runtime": [
                  "agent-runtime/**",
                  "backend/src/agent/**",
                  "backend/src/models/**",
                  "backend/src/services/**",
                  "backend/src/repositories/**",
                  "backend/src/infrastructure/**",
                  "backend/src/agent_client/schemas.py",
                  "backend/pyproject.toml",
                  "dominos_pakistan_menu_import.json",
                  ".github/workflows/deploy-agentcore.yml",
                  ".github/scripts/build-agentcore-update-input.py",
                  ".github/scripts/tests/**",
              ],
              "frontend": [
                  "frontend/**",
                  "amplify.yml",
              ],
              "infrastructure": [
                  "infra/**",
                  "docs/deployment.md",
                  "docs/cicd.md",
                  "infra/README.md",
                  ".github/workflows/validate-infra.yml",
              ],
          }

          def _matches(path: str, pattern: str) -> bool:
              normalized = path.replace("\\", "/")
              if pattern.endswith("/**"):
                  prefix = pattern[:-3]
                  return normalized == prefix or normalized.startswith(prefix + "/")
              return PurePosixPath(normalized).match(pattern)

          def write_output(name: str, value: bool) -> None:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write(f"{name}={str(value).lower()}\n")

          event_name = os.environ["EVENT_NAME"]
          if event_name == "workflow_dispatch":
              changed = ["__manual_full_validation__"]
              results = {name: True for name in groups}
          else:
              if event_name == "pull_request":
                  base = os.environ["PR_BASE_SHA"]
                  head = os.environ["PR_HEAD_SHA"]
              else:
                  before = os.environ.get("BEFORE_SHA", "")
                  head = os.environ["CURRENT_SHA"]
                  if before and set(before) != {"0"}:
                      base = before
                  else:
                      base = subprocess.check_output(
                          ["git", "rev-list", "--max-parents=0", head],
                          text=True,
                      ).strip()
              output = subprocess.check_output(
                  ["git", "diff", "--name-only", base, head],
                  text=True,
              )
              changed = [line.strip().replace("\\", "/") for line in output.splitlines() if line.strip()]
              if any(path == ".github/workflows/ci.yml" for path in changed):
                  results = {name: True for name in groups}
              else:
                  results = {
                      name: any(
                          _matches(path, pattern)
                          for path in changed
                          for pattern in patterns
                      )
                      for name, patterns in groups.items()
                  }

          print("Changed files:")
          for path in changed:
              print(f"  {path}")
          for name, value in results.items():
              print(f"{name}: {value}")
              write_output(name, value)
          PY

  backend:
    name: Backend tests and image validation
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

      - name: Build receipt Lambda Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            --file backend/Dockerfile.receipt-lambda \
            --tag fyp-receipt-lambda-ci:${{ github.sha }} \
            backend

      - name: Validate receipt Lambda container runtime
        run: |
          image_os="$(docker image inspect --format '{{.Os}}' fyp-receipt-lambda-ci:${{ github.sha }})"
          image_arch="$(docker image inspect --format '{{.Architecture}}' fyp-receipt-lambda-ci:${{ github.sha }})"
          if [ "$image_os" != "linux" ] || [ "$image_arch" != "amd64" ]; then
            echo "Receipt Lambda image platform mismatch: os=$image_os architecture=$image_arch" >&2
            exit 1
          fi

          docker run --rm -i \
            --platform linux/amd64 \
            --entrypoint python \
            fyp-receipt-lambda-ci:${{ github.sha }} - <<'PY'
          import platform

          import reportlab
          from src.lambda_handlers.receipt_outbox_recovery import (
              handler as receipt_outbox_recovery_handler,
          )
          from src.lambda_handlers.receipt_processing import (
              handler as receipt_processing_handler,
          )

          machine = platform.machine().lower()
          if machine not in {"x86_64", "amd64"}:
              raise SystemExit(
                  f"Receipt Lambda runtime architecture mismatch: {machine}"
              )
          if not callable(receipt_processing_handler):
              raise SystemExit("Receipt processing Lambda handler is not callable")
          if not callable(receipt_outbox_recovery_handler):
              raise SystemExit("Receipt recovery Lambda handler is not callable")

          print(
              "Receipt Lambda container validation passed: "
              f"image_os=linux image_arch=amd64 runtime_machine={machine} "
              f"reportlab_version={reportlab.Version}"
          )
          PY

      - name: Build backend Docker image
        run: docker build --platform linux/amd64 -t fyp-backend-ci:${{ github.sha }} backend

      - name: Validate Polly voice-reply container runtime
        run: |
          docker run --rm -i \
            --entrypoint python \
            fyp-backend-ci:${{ github.sha }} - <<'PY'
          import json
          import os
          import pwd
          import shutil
          import subprocess
          import tempfile
          from pathlib import Path

          from src.services.voice_reply_audio_converter import (
              VoiceReplyAudioConverter,
          )

          ffmpeg = shutil.which("ffmpeg")
          ffprobe = shutil.which("ffprobe")
          if not ffmpeg or not ffprobe:
              raise SystemExit("ffmpeg and ffprobe must exist in the backend image")

          uid = os.geteuid()
          username = pwd.getpwuid(uid).pw_name
          if uid == 0 or username != "app":
              raise SystemExit(
                  f"backend image must run as non-root app user; got {username} ({uid})"
              )

          with tempfile.TemporaryDirectory(prefix="voice-reply-ci-") as directory:
              root = Path(directory)
              source = root / "tone.mp3"
              output = root / "reply.ogg"
              subprocess.run(
                  [
                      ffmpeg,
                      "-hide_banner",
                      "-loglevel",
                      "error",
                      "-f",
                      "lavfi",
                      "-i",
                      "sine=frequency=440:duration=0.25",
                      "-ac",
                      "1",
                      "-ar",
                      "16000",
                      "-c:a",
                      "libmp3lame",
                      "-b:a",
                      "24k",
                      "-y",
                      str(source),
                  ],
                  check=True,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.PIPE,
              )

              converter = VoiceReplyAudioConverter(
                  timeout_seconds=10,
                  max_audio_bytes=1_048_576,
              )
              output.write_bytes(converter.convert(source.read_bytes()))
              probe = subprocess.run(
                  [
                      ffprobe,
                      "-v",
                      "error",
                      "-select_streams",
                      "a:0",
                      "-show_entries",
                      "stream=codec_name,sample_rate,channels:format=format_name",
                      "-of",
                      "json",
                      str(output),
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              metadata = json.loads(probe.stdout)
              streams = metadata.get("streams") or []
              if len(streams) != 1:
                  raise SystemExit(f"expected one audio stream, found {len(streams)}")
              stream = streams[0]
              format_names = set(
                  str(metadata.get("format", {}).get("format_name", "")).split(",")
              )
              expected = {
                  "codec_name": "opus",
                  "sample_rate": "48000",
                  "channels": 1,
              }
              actual = {key: stream.get(key) for key in expected}
              if actual != expected:
                  raise SystemExit(
                      f"voice reply stream mismatch: expected {expected}, got {actual}"
                  )
              if "ogg" not in format_names:
                  raise SystemExit(
                      f"voice reply container must be OGG, got {sorted(format_names)}"
                  )

              print(
                  "Voice reply container validation passed: "
                  f"user={username} uid={uid} codec_name=opus "
                  "sample_rate=48000 channels=1 format_name=ogg"
              )
          PY

      - name: Start backend container
        run: |
          docker run -d --name fyp-backend-ci-health \
            -p 8000:8000 \
            -e ENVIRONMENT=test \
            -e AWS_REGION=us-east-1 \
            -e MENU_TABLE_NAME=ci-menu \
            -e CARTS_TABLE_NAME=ci-carts \
            -e ORDERS_TABLE_NAME=ci-orders \
            -e CUSTOMERS_TABLE_NAME=ci-customers \
            -e AGENT_SESSIONS_TABLE_NAME=ci-agent-sessions \
            -e AGENT_REQUESTS_TABLE_NAME=ci-agent-requests \
            -e MENU_SESSIONS_TABLE_NAME=ci-menu-sessions \
            -e AUDIT_TABLE_NAME=ci-audit \
            -e MENU_SITE_BASE_URL=http://localhost:3000/menu \
            -e SESSION_TOKEN_SECRET=ci-session-token-secret \
            -e RESTAURANT_ID=ci-restaurant \
            -e BRANCH_ID=default \
            fyp-backend-ci:${{ github.sha }}

      - name: Test backend health endpoint
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs fyp-backend-ci-health
          exit 1

      - name: Stop backend container
        if: always()
        run: docker rm -f fyp-backend-ci-health || true

  agent-runtime:
    name: Agent runtime tests and image validation
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.agent_runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            agent-runtime/pyproject.toml

      - name: Install backend and agent runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./backend[dev]"
          python -m pip install -e "./agent-runtime[dev]"

      - name: Run agent runtime tests
        working-directory: agent-runtime
        env:
          PYTHONPATH: ${{ github.workspace }}/agent-runtime/src:${{ github.workspace }}/backend
        run: python -m pytest tests

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build AgentCore runtime Docker image
        run: docker build --platform linux/arm64 -f agent-runtime/Dockerfile -t fyp-agent-runtime-ci:${{ github.sha }} .

      - name: Start AgentCore runtime container
        run: docker run -d --platform linux/arm64 --name fyp-agent-runtime-ci-ping -p 8080:8080 fyp-agent-runtime-ci:${{ github.sha }}

      - name: Test AgentCore runtime ping endpoint
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8080/ping; then
              exit 0
            fi
            sleep 2
          done
          docker logs fyp-agent-runtime-ci-ping
          exit 1

      - name: Stop AgentCore runtime container
        if: always()
        run: docker rm -f fyp-agent-runtime-ci-ping || true

  frontend:
    name: Frontend validation
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_BRANCH_ID: default
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  infrastructure:
    name: Infrastructure validation
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.infrastructure == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install local CloudFormation tooling
        run: python -m pip install --upgrade pip cfn-lint

      - name: Validate CloudFormation YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          class CloudFormationLoader(yaml.SafeLoader):
              pass

          def cloudformation_tag(loader, tag_suffix, node):
              if isinstance(node, yaml.ScalarNode):
                  return loader.construct_scalar(node)
              if isinstance(node, yaml.SequenceNode):
                  return loader.construct_sequence(node)
              if isinstance(node, yaml.MappingNode):
                  return loader.construct_mapping(node)
              return None

          CloudFormationLoader.add_multi_constructor("!", cloudformation_tag)

          templates = [
              Path("infra/phase3-network.yaml"),
              Path("infra/phase7-ecs-api.yaml"),
              Path("infra/phase11-monitoring.yaml"),
              Path("infra/phase13-github-oidc.yaml"),
              Path("infra/phase14-knowledge-base.yaml"),
          ]
          for template in templates:
              with template.open("r", encoding="utf-8") as handle:
                  yaml.load(handle, Loader=CloudFormationLoader)
              print(f"YAML OK: {template}")
          PY

      - name: Lint CloudFormation templates
        run: |
          cfn-lint \
            infra/phase3-network.yaml \
            infra/phase7-ecs-api.yaml \
            infra/phase11-monitoring.yaml \
            infra/phase13-github-oidc.yaml \
            infra/phase14-knowledge-base.yaml

      - name: Validate Phase 14 Bedrock metadata configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          class CloudFormationLoader(yaml.SafeLoader):
              pass

          def cloudformation_tag(loader, tag_suffix, node):
              if isinstance(node, yaml.ScalarNode):
                  return loader.construct_scalar(node)
              if isinstance(node, yaml.SequenceNode):
                  return loader.construct_sequence(node)
              if isinstance(node, yaml.MappingNode):
                  return loader.construct_mapping(node)
              return None

          CloudFormationLoader.add_multi_constructor("!", cloudformation_tag)

          template = yaml.load(
              Path("infra/phase14-knowledge-base.yaml").read_text(encoding="utf-8"),
              Loader=CloudFormationLoader,
          )
          index = template["Resources"]["RestaurantKnowledgeVectorIndex"]["Properties"]
          knowledge_base = template["Resources"]["RestaurantKnowledgeBase"]["Properties"]
          data_source = template["Resources"]["RestaurantKnowledgeDataSource"]["Properties"]
          keys = index.get("MetadataConfiguration", {}).get("NonFilterableMetadataKeys", [])
          required = {"AMAZON_BEDROCK_TEXT", "AMAZON_BEDROCK_METADATA"}
          missing = sorted(required - set(keys))
          if missing:
              raise SystemExit(f"Missing required non-filterable metadata keys: {missing}")
          expected_names = {
              "RestaurantKnowledgeVectorIndex IndexName": (index.get("IndexName"), "restaurant-knowledge-index-v2"),
              "RestaurantKnowledgeBase Name": (knowledge_base.get("Name"), "fyp_dev_restaurant_knowledge_v2"),
              "RestaurantKnowledgeDataSource Name": (data_source.get("Name"), "fyp_dev_restaurant_documents_v2"),
          }
          mismatches = [
              f"{label} is {actual!r}, expected {expected!r}"
              for label, (actual, expected) in expected_names.items()
              if actual != expected
          ]
          if mismatches:
              raise SystemExit("; ".join(mismatches))
          print("Phase 14 Bedrock metadata configuration OK")
          PY

  quality-gate:
    name: CI / Quality gate
    if: always()
    needs:
      - changes
      - backend
      - agent-runtime
      - frontend
      - infrastructure
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Evaluate required CI results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          AGENT_RUNTIME_RESULT: ${{ needs.agent-runtime.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          INFRASTRUCTURE_RESULT: ${{ needs.infrastructure.result }}
        run: |
          set -euo pipefail

          echo "| Job | Result |"
          echo "| --- | --- |"
          echo "| changes | $CHANGES_RESULT |"
          echo "| backend | $BACKEND_RESULT |"
          echo "| AgentCore | $AGENT_RUNTIME_RESULT |"
          echo "| frontend | $FRONTEND_RESULT |"
          echo "| infrastructure | $INFRASTRUCTURE_RESULT |"

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Quality gate failed: changes job must succeed and produced '$CHANGES_RESULT'." >&2
            exit 1
          fi

          for item in \
            "backend:$BACKEND_RESULT" \
            "AgentCore:$AGENT_RUNTIME_RESULT" \
            "frontend:$FRONTEND_RESULT" \
            "infrastructure:$INFRASTRUCTURE_RESULT"
          do
            job="${item%%:*}"
            result="${item#*:}"
            case "$result" in
              success|skipped)
                ;;
              *)
                echo "Quality gate failed: $job result '$result' is not allowed." >&2
                exit 1
                ;;
            esac
          done

          echo "Quality gate passed."

  publish-receipt-image:
    name: Publish receipt Lambda image
    needs:
      - quality-gate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/event-driven-pdf-receipts'
    runs-on: ubuntu-latest
    environment: receipt-image
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: receipt-lambda-image-publication
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      AWS_ACCOUNT_ID: "352306494518"
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: fyp-dev-receipt-lambda
      IMAGE_TAG: ${{ github.sha }}
      LOCAL_IMAGE: fyp-receipt-lambda-publish:${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify source identity and fixed configuration
        shell: bash
        run: |
          set -euo pipefail

          source_sha="$(git rev-parse HEAD)"
          if [ "$source_sha" != "${{ github.sha }}" ]; then
            echo "Checked-out source SHA does not match github.sha." >&2
            exit 1
          fi
          if [ "$IMAGE_TAG" != "${{ github.sha }}" ]; then
            echo "Image tag does not match github.sha." >&2
            exit 1
          fi
          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Image tag must be a full 40-character hexadecimal Git commit SHA." >&2
            exit 1
          fi
          if [ "$AWS_REGION" != "us-east-1" ]; then
            echo "AWS_REGION must be us-east-1 for the dedicated receipt repository." >&2
            exit 1
          fi

      - name: Build receipt Lambda image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --platform linux/amd64 \
            --file backend/Dockerfile.receipt-lambda \
            --tag "$LOCAL_IMAGE" \
            backend

      - name: Validate receipt Lambda image platform
        shell: bash
        run: |
          set -euo pipefail

          image_os="$(docker image inspect --format '{{.Os}}' "$LOCAL_IMAGE")"
          image_arch="$(docker image inspect --format '{{.Architecture}}' "$LOCAL_IMAGE")"
          if [ "$image_os" != "linux" ] || [ "$image_arch" != "amd64" ]; then
            echo "Receipt Lambda image platform mismatch: os=$image_os architecture=$image_arch" >&2
            exit 1
          fi

      - name: Validate receipt Lambda container runtime
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm -i \
            --platform linux/amd64 \
            --entrypoint python \
            "$LOCAL_IMAGE" - <<'PY'
          import platform

          import reportlab
          from src.lambda_handlers.receipt_outbox_recovery import (
              handler as receipt_outbox_recovery_handler,
          )
          from src.lambda_handlers.receipt_processing import (
              handler as receipt_processing_handler,
          )

          machine = platform.machine().lower()
          if machine not in {"x86_64", "amd64"}:
              raise SystemExit(
                  f"Receipt Lambda runtime architecture mismatch: {machine}"
              )
          if not callable(receipt_processing_handler):
              raise SystemExit("Receipt processing Lambda handler is not callable")
          if not callable(receipt_outbox_recovery_handler):
              raise SystemExit("Receipt recovery Lambda handler is not callable")

          print(
              "Receipt Lambda container validation passed: "
              f"image_os=linux image_arch=amd64 runtime_machine={machine} "
              f"reportlab_version={reportlab.Version}"
          )
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.RECEIPT_IMAGE_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: receipt-image-${{ github.run_id }}

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail

          account="$(aws sts get-caller-identity --query Account --output text)"
          caller_arn="$(aws sts get-caller-identity --query Arn --output text)"
          expected_arn="arn:aws:sts::${AWS_ACCOUNT_ID}:assumed-role/fyp-github-receipt-image-pusher/receipt-image-${GITHUB_RUN_ID}"
          if [ "$account" != "$AWS_ACCOUNT_ID" ]; then
            echo "AWS account mismatch." >&2
            exit 1
          fi
          if [ "$caller_arn" != "$expected_arn" ]; then
            echo "AWS assumed-role identity mismatch." >&2
            exit 1
          fi

      - name: Verify immutable ECR tag is absent
        shell: bash
        run: |
          set -euo pipefail

          set +e
          describe_error="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" 2>&1)"
          describe_status=$?
          set -e

          if [ "$describe_status" -eq 0 ]; then
            echo "Immutable commit tag $IMAGE_TAG already exists and will not be overwritten." >&2
            exit 1
          fi
          if [[ "$describe_error" != *"ImageNotFoundException"* ]]; then
            echo "Unable to prove that the immutable ECR tag is absent; refusing publication." >&2
            exit 1
          fi
          echo "Immutable commit tag is available for first publication."

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify ECR registry
        shell: bash
        env:
          AUTHENTICATED_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail

          expected_registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          if [ "$AUTHENTICATED_REGISTRY" != "$expected_registry" ]; then
            echo "Authenticated ECR registry does not match the dedicated receipt registry." >&2
            exit 1
          fi

      - name: Tag and push validated receipt image
        id: publish-image
        shell: bash
        env:
          AUTHENTICATED_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail

          image_uri="${AUTHENTICATED_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker tag "$LOCAL_IMAGE" "$image_uri"
          docker push "$image_uri"
          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"

      - name: Verify published image digest
        id: verify-digest
        shell: bash
        run: |
          set -euo pipefail

          describe_digest=""
          for attempt in {1..10}; do
            set +e
            describe_result="$(aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$IMAGE_TAG" \
              --region "$AWS_REGION" \
              --query 'imageDetails[0].imageDigest' \
              --output text 2>&1)"
            describe_status=$?
            set -e

            if [ "$describe_status" -eq 0 ]; then
              describe_digest="$describe_result"
              break
            fi
            if [[ "$describe_result" != *"ImageNotFoundException"* ]]; then
              echo "Unexpected error while verifying the published image digest." >&2
              exit 1
            fi
            if [ "$attempt" -lt 10 ]; then
              sleep 2
            fi
          done

          if [[ ! "$describe_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "DescribeImages did not return a valid image digest." >&2
            exit 1
          fi

          batch_digest="$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'images[0].imageId.imageDigest' \
            --output text)"
          if [[ ! "$batch_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "BatchGetImage did not return a valid image digest." >&2
            exit 1
          fi
          if [ "$describe_digest" != "$batch_digest" ]; then
            echo "DescribeImages and BatchGetImage digest values do not match." >&2
            exit 1
          fi

          echo "image_digest=$describe_digest" >> "$GITHUB_OUTPUT"
          echo "Published image digest verified."

      - name: Write publication summary
        shell: bash
        env:
          IMAGE_URI: ${{ steps.publish-image.outputs.image_uri }}
          IMAGE_DIGEST: ${{ steps.verify-digest.outputs.image_digest }}
        run: |
          set -euo pipefail

          {
            echo "## Receipt Lambda image publication"
            echo
            echo "- Source commit SHA: \`$GITHUB_SHA\`"
            echo "- Image tag: \`$IMAGE_TAG\`"
            echo "- ECR image URI: \`$IMAGE_URI\`"
            echo "- Verified image digest: \`$IMAGE_DIGEST\`"
            echo "- AWS account: \`$AWS_ACCOUNT_ID\`"
            echo "- AWS region: \`$AWS_REGION\`"
            echo "- Repository: \`$ECR_REPOSITORY\`"
            echo "- Platform: \`linux/amd64\`"
            echo
            echo "This workflow only published the container image; it did not deploy or activate the Lambda receipt system."
          } >> "$GITHUB_STEP_SUMMARY"
