  WhatsAppVoiceWorkerAgentCorePolicy:
    Type: AWS::IAM::Policy
    Condition: HasAgentCoreRuntimeArn
    Properties:
      PolicyName: !Sub ${ProjectName}-voice-worker-agentcore
      Roles:
        - !Ref WhatsAppVoiceWorkerTaskRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - bedrock-agentcore:InvokeAgentRuntime
              - bedrock-agentcore:InvokeAgentRuntimeForUser
            Resource:
              - !Ref AgentCoreRuntimeArn
              - !Sub ${AgentCoreRuntimeArn}/runtime-endpoint/*

  WhatsAppVoiceWorkerVoicePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${ProjectName}-voice-worker-media-queue-transcribe
      Roles:
        - !Ref WhatsAppVoiceWorkerTaskRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: GetVoiceMediaBucketLocation
            Effect: Allow
            Action:
              - s3:GetBucketLocation
            Resource: !GetAtt VoiceMediaBucket.Arn
          - Sid: ManageTemporaryVoiceInput
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:DeleteObject
            Resource: !Sub ${VoiceMediaBucket.Arn}/voice-input/*
          - Sid: ConsumeAndRecoverVoiceQueue
            Effect: Allow
            Action:
              - sqs:SendMessage
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:ChangeMessageVisibility
              - sqs:GetQueueAttributes
            Resource: !GetAtt VoiceProcessingQueue.Arn
          - Sid: StartVoiceTranscriptionJob
            Effect: Allow
            Action:
              - transcribe:StartTranscriptionJob
            Resource: "*"
          - Sid: ManageScopedVoiceTranscriptionJobs
            Effect: Allow
            Action:
              - transcribe:GetTranscriptionJob
              - transcribe:DeleteTranscriptionJob
            Resource: !Sub arn:${AWS::Partition}:transcribe:${AWS::Region}:${AWS::AccountId}:transcription-job/${ProjectName}-whatsapp-voice-*
          - !If
            - HasVoiceTranscribeRoleArn
            - Sid: AssumeConfiguredVoiceTranscribeRole
              Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: !Ref VoiceTranscribeRoleArn
            - !Ref AWS::NoValue

  WhatsAppVoiceWorkerPollyPolicy:
    Type: AWS::IAM::Policy
    Condition: IsWhatsAppVoiceReplyEnabled
    Properties:
      PolicyName: !Sub ${ProjectName}-voice-worker-polly
      Roles:
        - !Ref WhatsAppVoiceWorkerTaskRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # SynthesizeSpeech does not support resource-level IAM permissions.
          - Effect: Allow
            Action: polly:SynthesizeSpeech
            Resource: "*"

