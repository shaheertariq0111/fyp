            Resource: "*"
          - Sid: PublishAgentCoreMetrics
            Effect: Allow
            Action:
              - cloudwatch:PutMetricData
            Resource: "*"
            Condition:
              StringEquals:
                cloudwatch:namespace: bedrock-agentcore

  WhatsAppVoiceJobsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref WhatsAppVoiceJobsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: N
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: DueJobsIndex
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: DataClassification
          Value: temporary-voice-job-state

  AgentRequestsTable:
    Type: AWS::DynamoDB::Table
    Condition: ShouldCreateAgentRequestsTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref AgentRequestsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ConversationMessagesTable:
    Type: AWS::DynamoDB::Table
    Condition: ShouldCreateConversationMessagesTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref ConversationMessagesTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  TicketsTable:
    Type: AWS::DynamoDB::Table
    Condition: ShouldCreateTicketsTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref TicketsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: HasBackendImageUri
    Properties:
      Family: !Sub ${ProjectName}-backend
      Cpu: !Ref BackendCpu
      Memory: !Ref BackendMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt EcsTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt EcsTaskRole.Arn
      ContainerDefinitions:
        - Name: backend
          Image: !Ref BackendImageUri
          Essential: true
          PortMappings:
            - ContainerPort: !Ref BackendContainerPort
              Protocol: tcp
              AppProtocol: http
          Environment:
            - Name: ENVIRONMENT
              Value: !Ref EnvironmentName
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: WHATSAPP_VOICE_ENABLED
              Value: !Ref WhatsAppVoiceEnabled
            - Name: VOICE_MEDIA_BUCKET_NAME
              Value: !Ref VoiceMediaBucket
            - Name: VOICE_MEDIA_INPUT_PREFIX
              Value: voice-input/
            - Name: VOICE_JOB_QUEUE_URL
              Value: !Ref VoiceProcessingQueue
            - Name: WHATSAPP_VOICE_JOBS_TABLE_NAME
              Value: !Ref WhatsAppVoiceJobsTableName
            - Name: VOICE_MEDIA_ALLOWED_HOSTS
              Value: !Ref VoiceMediaAllowedHosts
            - Name: VOICE_TRANSCRIPTION_LANGUAGE_CODE
              Value: !Ref VoiceTranscriptionLanguageCode
            - Name: VOICE_TRANSCRIPTION_IDENTIFY_LANGUAGE
              Value: !Ref VoiceTranscriptionIdentifyLanguage
            - Name: VOICE_SQS_WAIT_TIME_SECONDS
              Value: !Ref VoiceSqsWaitTimeSeconds
            - Name: VOICE_SQS_VISIBILITY_TIMEOUT_SECONDS
              Value: !Ref VoiceSqsVisibilityTimeoutSeconds
            - Name: VOICE_SQS_HEARTBEAT_SECONDS
              Value: !Ref VoiceSqsHeartbeatSeconds
            - Name: VOICE_JOB_LEASE_SECONDS
              Value: !Ref VoiceJobLeaseSeconds
            - Name: VOICE_JOB_TTL_HOURS
              Value: !Ref VoiceJobTtlHours
            - Name: VOICE_TRANSCRIPTION_JOB_PREFIX
              Value: !Ref VoiceTranscriptionJobPrefix
            - Name: VOICE_MAX_MEDIA_BYTES
              Value: "10485760"
            - Name: VOICE_DOWNLOAD_TIMEOUT_SECONDS
              Value: "10"
            - Name: VOICE_TRANSCRIPTION_TIMEOUT_SECONDS
              Value: "180"
            - Name: BEDROCK_MODEL_ID
              Value: !Ref BedrockModelId
            - Name: BEDROCK_GUARDRAIL_ID
              Value: !Ref BedrockGuardrailId
            - Name: BEDROCK_GUARDRAIL_VERSION
              Value: !Ref BedrockGuardrailVersion
            - Name: KNOWLEDGE_BASE_ID
              Value: !Ref KnowledgeBaseId
            - Name: AGENTCORE_RUNTIME_ARN
              Value: !Ref AgentCoreRuntimeArn
            - Name: AGENT_REQUESTS_TABLE_NAME
              Value: !Ref AgentRequestsTableName
            - Name: CONVERSATION_MESSAGES_TABLE_NAME
              Value: !Ref ConversationMessagesTableName
            - Name: CONVERSATION_MESSAGE_TTL_DAYS
              Value: "90"
            - Name: TICKETS_TABLE_NAME
              Value: !Ref TicketsTableName
            - Name: SUPPORT_PHONE_NUMBER
              Value: !Ref SupportPhoneNumber
            - Name: AGENTFLO_GATEWAY_BASE_URL
              Value: !Ref AgentfloGatewayBaseUrl
            - Name: AGENTFLO_GATEWAY_TENANT_ID
              Value: !Ref AgentfloGatewayTenantId
            - Name: AGENTFLO_GATEWAY_AGENT_ID
              Value: !Ref AgentfloGatewayAgentId
            - Name: AGENTFLO_GATEWAY_ACTOR_ID
              Value: !Ref AgentfloGatewayActorId
            - Name: MENU_TABLE_NAME
              Value: !Ref MenuTableName
            - Name: CARTS_TABLE_NAME
              Value: !Ref CartsTableName
            - Name: ORDERS_TABLE_NAME
              Value: !Ref OrdersTableName
            - Name: CUSTOMERS_TABLE_NAME
              Value: !Ref CustomersTableName
            - Name: AGENT_SESSIONS_TABLE_NAME
              Value: !Ref AgentSessionsTableName
            - Name: MENU_SESSIONS_TABLE_NAME
              Value: !Ref MenuSessionsTableName
            - Name: AUDIT_TABLE_NAME
              Value: !Ref AuditTableName
            - Name: MENU_SITE_BASE_URL
              Value: !Ref MenuSiteBaseUrl
            - Name: RESTAURANT_ID
              Value: !Ref RestaurantId
            - Name: BRANCH_ID
              Value: !Ref BranchId
            - Name: LOG_LEVEL
              Value: INFO
            - Name: FRONTEND_CORS_ORIGINS
              Value: !Ref FrontendCorsOrigins
            - Name: ADMIN_USERNAME
              Value: !Ref AdminUsername
            - Name: STRANDS_SESSION_STORAGE_DIR
              Value: ""
          Secrets:
            - !If
              - HasSessionTokenSecret
              - Name: SESSION_TOKEN_SECRET
                ValueFrom: !Ref SessionTokenSecretArn
              - !Ref AWS::NoValue
            - !If
              - HasAgentfloWhatsAppWebhookSecret
              - Name: AGENTFLO_WHATSAPP_WEBHOOK_SECRET
                ValueFrom: !Ref AgentfloWhatsAppWebhookSecretArn
              - !Ref AWS::NoValue
            - !If
              - HasAgentfloGatewayApiKeySecret
              - Name: AGENTFLO_GATEWAY_API_KEY
                ValueFrom: !Ref AgentfloGatewayApiKeySecretArn
              - !Ref AWS::NoValue
            - !If
              - HasAdminPasswordSecret
              - Name: ADMIN_PASSWORD
                ValueFrom: !Ref AdminPasswordSecretArn
              - !Ref AWS::NoValue
            - !If
              - HasAdminSessionSecret
              - Name: ADMIN_SESSION_SECRET
                ValueFrom: !Ref AdminSessionSecretArn
              - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend
          HealthCheck:
            Command:
              - CMD-SHELL
              - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  WhatsAppVoiceWorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: HasBackendImageUri
    Properties:
      Family: !Sub ${ProjectName}-whatsapp-voice-worker
      Cpu: !Ref WorkerCpu
      Memory: !Ref WorkerMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt WhatsAppVoiceWorkerExecutionRole.Arn
      TaskRoleArn: !GetAtt WhatsAppVoiceWorkerTaskRole.Arn
      ContainerDefinitions:
        - Name: whatsapp-voice-worker
          Image: !Ref BackendImageUri
          Essential: true
          Command:
            - python
            - -m
            - src.workers.whatsapp_voice_worker
          StopTimeout: 120
          Environment:
            - Name: ENVIRONMENT
              Value: !Ref EnvironmentName
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: WHATSAPP_VOICE_ENABLED
              Value: "false"
            - Name: VOICE_MEDIA_BUCKET_NAME
              Value: !Ref VoiceMediaBucket
            - Name: VOICE_MEDIA_INPUT_PREFIX
              Value: voice-input/
            - Name: VOICE_JOB_QUEUE_URL
              Value: !Ref VoiceProcessingQueue
            - Name: WHATSAPP_VOICE_JOBS_TABLE_NAME
              Value: !Ref WhatsAppVoiceJobsTableName
            - Name: VOICE_MAX_MEDIA_BYTES
              Value: "10485760"
            - Name: VOICE_DOWNLOAD_TIMEOUT_SECONDS
              Value: "10"
            - Name: VOICE_TRANSCRIPTION_TIMEOUT_SECONDS
              Value: "180"
            - Name: VOICE_MEDIA_ALLOWED_HOSTS
              Value: !Ref VoiceMediaAllowedHosts
            - Name: VOICE_TRANSCRIPTION_LANGUAGE_CODE
              Value: !Ref VoiceTranscriptionLanguageCode
            - Name: VOICE_TRANSCRIPTION_IDENTIFY_LANGUAGE
              Value: !Ref VoiceTranscriptionIdentifyLanguage
            - Name: VOICE_SQS_WAIT_TIME_SECONDS
              Value: !Ref VoiceSqsWaitTimeSeconds
            - Name: VOICE_SQS_VISIBILITY_TIMEOUT_SECONDS
              Value: !Ref VoiceSqsVisibilityTimeoutSeconds
            - Name: VOICE_SQS_HEARTBEAT_SECONDS
              Value: !Ref VoiceSqsHeartbeatSeconds
            - Name: VOICE_JOB_LEASE_SECONDS
              Value: !Ref VoiceJobLeaseSeconds
            - Name: VOICE_JOB_TTL_HOURS
              Value: !Ref VoiceJobTtlHours
            - Name: VOICE_TRANSCRIPTION_JOB_PREFIX
              Value: !Ref VoiceTranscriptionJobPrefix
            - Name: VOICE_TRANSCRIBE_ROLE_ARN
              Value: !Ref VoiceTranscribeRoleArn
            - Name: WHATSAPP_VOICE_REPLY_ENABLED
              Value: !Ref WhatsAppVoiceReplyEnabled
            - Name: POLLY_VOICE_ID
              Value: !Ref PollyVoiceId
            - Name: POLLY_ENGINE
              Value: !Ref PollyEngine
            - Name: POLLY_LANGUAGE_CODE
              Value: !Ref PollyLanguageCode
            - Name: POLLY_MAX_TEXT_CHARS
              Value: !Ref PollyMaxTextChars
            - Name: VOICE_REPLY_MAX_AUDIO_BYTES
              Value: !Ref VoiceReplyMaxAudioBytes
            - Name: VOICE_REPLY_SYNTHESIS_TIMEOUT_SECONDS
              Value: !Ref VoiceReplySynthesisTimeoutSeconds
            - Name: VOICE_REPLY_CONVERSION_TIMEOUT_SECONDS
              Value: !Ref VoiceReplyConversionTimeoutSeconds
            - Name: AGENTFLO_AUDIO_FIRESTORE
              Value: !Ref AgentfloAudioFirestore
            - Name: AGENTFLO_AUDIO_KINESIS
              Value: !Ref AgentfloAudioKinesis
            - Name: BEDROCK_MODEL_ID
              Value: !Ref BedrockModelId
            - Name: BEDROCK_GUARDRAIL_ID
              Value: !Ref BedrockGuardrailId
            - Name: BEDROCK_GUARDRAIL_VERSION
              Value: !Ref BedrockGuardrailVersion
            - Name: KNOWLEDGE_BASE_ID
              Value: !Ref KnowledgeBaseId
            - Name: AGENTCORE_RUNTIME_ARN
              Value: !Ref AgentCoreRuntimeArn
            - Name: AGENT_REQUESTS_TABLE_NAME
              Value: !Ref AgentRequestsTableName
            - Name: CONVERSATION_MESSAGES_TABLE_NAME
              Value: !Ref ConversationMessagesTableName
            - Name: CONVERSATION_MESSAGE_TTL_DAYS
              Value: "90"
            - Name: TICKETS_TABLE_NAME
              Value: !Ref TicketsTableName
            - Name: SUPPORT_PHONE_NUMBER
              Value: !Ref SupportPhoneNumber
            - Name: AGENTFLO_GATEWAY_BASE_URL
              Value: !Ref AgentfloGatewayBaseUrl
            - Name: AGENTFLO_GATEWAY_TENANT_ID
              Value: !Ref AgentfloGatewayTenantId
            - Name: AGENTFLO_GATEWAY_AGENT_ID
              Value: !Ref AgentfloGatewayAgentId
            - Name: AGENTFLO_GATEWAY_ACTOR_ID
              Value: !Ref AgentfloGatewayActorId
            - Name: MENU_TABLE_NAME
              Value: !Ref MenuTableName
            - Name: CARTS_TABLE_NAME
              Value: !Ref CartsTableName
            - Name: ORDERS_TABLE_NAME
              Value: !Ref OrdersTableName
            - Name: CUSTOMERS_TABLE_NAME
              Value: !Ref CustomersTableName
            - Name: AGENT_SESSIONS_TABLE_NAME
              Value: !Ref AgentSessionsTableName
            - Name: MENU_SESSIONS_TABLE_NAME
              Value: !Ref MenuSessionsTableName
            - Name: AUDIT_TABLE_NAME
              Value: !Ref AuditTableName
            - Name: MENU_SITE_BASE_URL
              Value: !Ref MenuSiteBaseUrl
            - Name: RESTAURANT_ID
              Value: !Ref RestaurantId
            - Name: BRANCH_ID
              Value: !Ref BranchId
            - Name: LOG_LEVEL
              Value: INFO
            - Name: FRONTEND_CORS_ORIGINS
              Value: !Ref FrontendCorsOrigins
            - Name: STRANDS_SESSION_STORAGE_DIR
              Value: ""
          Secrets:
            - !If
              - HasSessionTokenSecret
              - Name: SESSION_TOKEN_SECRET
                ValueFrom: !Ref SessionTokenSecretArn
              - !Ref AWS::NoValue
            - !If
              - HasAgentfloGatewayApiKeySecret
              - Name: AGENTFLO_GATEWAY_API_KEY
                ValueFrom: !Ref AgentfloGatewayApiKeySecretArn
              - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WhatsAppVoiceWorkerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: whatsapp-voice-worker
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  BackendService:
    Type: AWS::ECS::Service
    Condition: HasBackendImageUri
    DependsOn:
      - BackendRouteDefault
    Properties:
      ServiceName: !Sub ${ProjectName}-backend
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref BackendTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      EnableExecuteCommand: false
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref BackendTaskSecurityGroup
          Subnets: !Ref PublicSubnetIds
      ServiceRegistries:
        - RegistryArn: !GetAtt BackendDiscoveryService.Arn
          ContainerName: backend
          ContainerPort: !Ref BackendContainerPort
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  WhatsAppVoiceWorkerService:
    Type: AWS::ECS::Service
    Condition: HasBackendImageUri
    Properties:
      ServiceName: !Sub ${ProjectName}-whatsapp-voice-worker
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref WhatsAppVoiceWorkerTaskDefinition
      DesiredCount: !Ref WorkerDesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      EnableExecuteCommand: false
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref WhatsAppVoiceWorkerSecurityGroup
          Subnets: !Ref PublicSubnetIds
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  BackendHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${ProjectName}-backend
      ProtocolType: HTTP
      DisableExecuteApiEndpoint: false
      CorsConfiguration:
        AllowCredentials: true
        AllowHeaders:
          - Content-Type
        ExposeHeaders:
          - X-Request-ID
          - X-Agent-Request-ID
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - OPTIONS
        AllowOrigins:
          - !Ref FrontendCorsOrigins
        MaxAge: 3600
      Tags:
        Project: !Ref ProjectName

  BackendVpcLink:
    Type: AWS::ApiGatewayV2::VpcLink
    Properties:
      Name: !Sub ${ProjectName}-backend
      SecurityGroupIds:
        - !Ref VpcLinkSecurityGroup
      SubnetIds: !Ref PublicSubnetIds
      Tags:
        Project: !Ref ProjectName

  BackendIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BackendHttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      ConnectionType: VPC_LINK
      ConnectionId: !Ref BackendVpcLink
      IntegrationUri: !GetAtt BackendDiscoveryService.Arn
      PayloadFormatVersion: "1.0"
      RequestParameters:
        "overwrite:path": "$request.path"
      TimeoutInMillis: 30000

  BackendRouteDefault:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BackendHttpApi
      RouteKey: $default
      Target: !Sub integrations/${BackendIntegration}

  BackendDefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref BackendHttpApi
      StageName: $default
      AutoDeploy: true
      AccessLogSettings:
        DestinationArn: !GetAtt BackendApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","integrationError":"$context.integrationErrorMessage"}'
      Tags:
        Project: !Ref ProjectName

Outputs:
  BackendApiEndpoint:
    Description: Public API Gateway HTTPS endpoint for the backend.
    Value: !GetAtt BackendHttpApi.ApiEndpoint
  BackendRepositoryUri:
    Description: Backend ECR repository URI.
    Value: !GetAtt BackendRepository.RepositoryUri
  AgentRuntimeRepositoryUri:
    Description: AgentCore Runtime ECR repository URI.
    Value: !GetAtt AgentRuntimeRepository.RepositoryUri
  EcsClusterName:
    Value: !Ref EcsCluster
  BackendServiceName:
    Condition: HasBackendImageUri
    Value: !GetAtt BackendService.Name
  BackendCloudMapServiceArn:
    Value: !GetAtt BackendDiscoveryService.Arn
  BackendCloudMapServiceId:
    Value: !Ref BackendDiscoveryService
  BackendTaskExecutionRoleArn:
    Value: !GetAtt EcsTaskExecutionRole.Arn
  BackendTaskRoleArn:
    Value: !GetAtt EcsTaskRole.Arn
  WhatsAppVoiceJobsTableName:
    Description: Dedicated durable WhatsApp voice processing-state table name.
    Value: !Ref WhatsAppVoiceJobsTable
  WhatsAppVoiceJobsTableArn:
    Description: Dedicated durable WhatsApp voice processing-state table ARN.
    Value: !GetAtt WhatsAppVoiceJobsTable.Arn
  WhatsAppVoiceWorkerTaskDefinitionArn:
    Condition: HasBackendImageUri
    Value: !Ref WhatsAppVoiceWorkerTaskDefinition
  WhatsAppVoiceWorkerServiceName:
    Condition: HasBackendImageUri
    Value: !GetAtt WhatsAppVoiceWorkerService.Name
  WhatsAppVoiceWorkerLogGroupName:
    Value: !Ref WhatsAppVoiceWorkerLogGroup
  WhatsAppVoiceWorkerSecurityGroupId:
    Value: !Ref WhatsAppVoiceWorkerSecurityGroup
  WhatsAppVoiceWorkerDesiredCount:
    Description: Configured worker desired count; remains zero until controlled activation.
    Value: !Ref WorkerDesiredCount
  AgentCoreExecutionRoleArn:
    Value: !GetAtt AgentCoreExecutionRole.Arn
  VoiceMediaBucketName:
    Description: Dedicated temporary customer voice-input bucket name.
    Value: !Ref VoiceMediaBucket
  VoiceMediaBucketArn:
    Description: Dedicated temporary customer voice-input bucket ARN.
    Value: !GetAtt VoiceMediaBucket.Arn
  VoiceProcessingQueueUrl:
    Description: Encrypted inbound WhatsApp voice-processing queue URL.
    Value: !Ref VoiceProcessingQueue
  VoiceProcessingQueueArn:
    Description: Encrypted inbound WhatsApp voice-processing queue ARN.
    Value: !GetAtt VoiceProcessingQueue.Arn
  VoiceProcessingDeadLetterQueueArn:
    Description: Dead-letter queue ARN for failed inbound WhatsApp voice jobs.
    Value: !GetAtt VoiceProcessingDeadLetterQueue.Arn
  AgentRequestsTableName:
    Value: !Ref AgentRequestsTableName
  ConversationMessagesTableName:
    Value: !Ref ConversationMessagesTableName
  ConversationMessagesTableArn:
    Value: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConversationMessagesTableName}
  TicketsTableName:
    Value: !Ref TicketsTableName
  TicketsTableArn:
    Value: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TicketsTableName}
  MenuTableName:
    Value: !Ref MenuTableName
  CartsTableName:
    Value: !Ref CartsTableName
  OrdersTableName:
    Value: !Ref OrdersTableName
  CustomersTableName:
    Value: !Ref CustomersTableName
  AgentSessionsTableName:
    Value: !Ref AgentSessionsTableName
  MenuSessionsTableName:
    Value: !Ref MenuSessionsTableName
  AuditTableName:
    Value: !Ref AuditTableName
