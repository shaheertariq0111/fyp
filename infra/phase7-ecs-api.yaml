      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RetrieveConfiguredKnowledgeBase
            Effect: Allow
            Action:
              - bedrock:Retrieve
            Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}

  AgentCoreExecutionLogsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${ProjectName}-agentcore-logs
      Roles:
        - !Ref AgentCoreExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DescribeAgentCoreRuntimeLogStreamsAndCreateLogGroup
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:DescribeLogStreams
            Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*
          - Sid: DescribeAgentCoreLogGroups
            Effect: Allow
            Action:
              - logs:DescribeLogGroups
            Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*
          - Sid: WriteAgentCoreRuntimeLogEvents
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:log-stream:*
          - Sid: WriteAgentCoreTraces
            Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
              - xray:GetSamplingRules
