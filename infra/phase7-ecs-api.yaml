AWSTemplateFormatVersion: "2010-09-09"
Description: Phase 7 infrastructure for the FYP FastAPI backend behind API Gateway, VPC Link, Cloud Map, and ECS Fargate.

Parameters:
  ProjectName:
    Type: String
    Default: fyp-dev
    AllowedPattern: "^[a-z][a-z0-9-]{1,31}$"
    Description: Lowercase prefix used for project resources.
  EnvironmentName:
    Type: String
    Default: production
    AllowedValues:
      - staging
      - production
    Description: Runtime environment value passed to the backend container.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC where ECS tasks and the API Gateway VPC Link will run.
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnet IDs for low-cost development ECS tasks and API Gateway VPC Link ENIs.
  BackendImageUri:
    Type: String
    Default: ""
    Description: Full backend image URI. Leave empty only when DesiredCount is 0 and the generated ECR latest tag will be used later.
  DesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 10
    Description: Start at 0 until the backend image and runtime config are ready.
  WhatsAppVoiceEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Keep disabled until the inbound voice backend and durable worker are deployed.
  WorkerDesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 10
    Description: Durable WhatsApp voice worker count. Keep at 0 until provider configuration is confirmed.
  WorkerCpu:
    Type: String
    Default: "512"
    AllowedValues:
      - "256"
      - "512"
      - "1024"
      - "2048"
      - "4096"
  WorkerMemory:
    Type: String
    Default: "1024"
    AllowedValues:
      - "512"
      - "1024"
      - "2048"
      - "3072"
      - "4096"
      - "8192"
  WhatsAppVoiceJobsTableName:
    Type: String
    Default: fyp-dev-WhatsAppVoiceJobs
    AllowedPattern: "^[A-Za-z0-9_.-]{3,255}$"
    Description: Dedicated CloudFormation-managed durable voice-job table.
  VoiceMediaAllowedHosts:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9.-]+(,[a-z0-9.-]+)*$"
    Description: Comma-separated exact media hostnames. Intentionally empty until verified.
  VoiceTranscriptionLanguageCode:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z]{2,3}-[A-Z]{2}$"
    Description: Exact Transcribe language code; leave empty unless identify-language is false and activation is approved.
  VoiceTranscriptionIdentifyLanguage:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
  VoiceSqsWaitTimeSeconds:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 20
  VoiceSqsVisibilityTimeoutSeconds:
    Type: Number
    Default: 300
    MinValue: 1
    MaxValue: 43200
  VoiceSqsHeartbeatSeconds:
    Type: Number
    Default: 60
    MinValue: 1
    MaxValue: 43199
  VoiceJobLeaseSeconds:
    Type: Number
    Default: 180
    MinValue: 2
    MaxValue: 43200
  VoiceJobTtlHours:
    Type: Number
    Default: 24
    MinValue: 1
    MaxValue: 168
  VoiceTranscriptionJobPrefix:
    Type: String
    Default: fyp-dev-whatsapp-voice-
    AllowedPattern: "^[a-z0-9][a-z0-9-]{0,62}-whatsapp-voice-$"
    Description: Must match the existing Transcribe job IAM resource prefix.
  VoiceTranscribeRoleArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/[A-Za-z0-9+=,.@*-]+(?:/[A-Za-z0-9+=,.@*-]+)*$"
    Description: Optional cross-account IAM role assumed only by the WhatsApp voice worker for Amazon Transcribe.
  WhatsAppVoiceReplyEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Independently enables optional Polly audio after successful voice-worker text delivery.
  PollyVoiceId:
    Type: String
    Default: Joanna
    AllowedPattern: "^[A-Za-z0-9-]{1,64}$"
  PollyEngine:
    Type: String
    Default: neural
    AllowedValues:
      - standard
      - neural
      - long-form
      - generative
  PollyLanguageCode:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z]{2,3}-[A-Z]{2}$"
  PollyMaxTextChars:
    Type: Number
    Default: 1500
    MinValue: 1
    MaxValue: 3000
  VoiceReplyMaxAudioBytes:
    Type: Number
    Default: 2097152
    MinValue: 1
    MaxValue: 10485760
  VoiceReplySynthesisTimeoutSeconds:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 60
  VoiceReplyConversionTimeoutSeconds:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 60
  AgentfloAudioFirestore:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
  AgentfloAudioKinesis:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
  BackendCpu:
    Type: String
    Default: "512"
    AllowedValues:
      - "256"
      - "512"
      - "1024"
      - "2048"
      - "4096"
  BackendMemory:
    Type: String
    Default: "1024"
    AllowedValues:
      - "512"
      - "1024"
      - "2048"
      - "3072"
      - "4096"
      - "8192"
  BackendContainerPort:
    Type: Number
    Default: 8000
    AllowedValues:
      - 8000
    Description: FastAPI backend container port. This deployment expects port 8000.
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues:
      - 7
      - 14
      - 30
      - 60
      - 90
      - 180
      - 365
  CreateAgentRequestsTable:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Set true only if the AgentRequests table does not already exist.
  AgentRequestsTableName:
    Type: String
    Default: fyp-dev-AgentRequests
  CreateConversationMessagesTable:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Set true only if the ConversationMessages table does not already exist.
  ConversationMessagesTableName:
    Type: String
    Default: fyp-dev-ConversationMessages
  CreateTicketsTable:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Set true only if the Tickets table does not already exist.
  TicketsTableName:
    Type: String
    Default: fyp-dev-Tickets
  SupportPhoneNumber:
    Type: String
    Default: ""
    Description: Optional customer-visible support phone number.
  MenuTableName:
    Type: String
    Default: fyp-dev-Menu
  CartsTableName:
    Type: String
    Default: fyp-dev-Carts
  OrdersTableName:
    Type: String
    Default: fyp-dev-Orders
  CustomersTableName:
    Type: String
    Default: fyp-dev-Customers
  AgentSessionsTableName:
    Type: String
    Default: fyp-dev-AgentSessions
  MenuSessionsTableName:
    Type: String
    Default: fyp-dev-MenuSessions
  AuditTableName:
    Type: String
    Default: fyp-dev-Audit
  MenuSiteBaseUrl:
    Type: String
    Description: Public frontend menu URL used in generated menu-session links.
  RestaurantId:
    Type: String
    Default: shaheer-fyp-restaurant
  BranchId:
    Type: String
    Default: main
  BedrockModelId:
    Type: String
    Description: Bedrock model ID used by backend config until AgentCore invocation is fully wired.
  BedrockGuardrailId:
    Type: String
    Default: ""
  BedrockGuardrailVersion:
    Type: String
    Default: ""
  KnowledgeBaseId:
    Type: String
    Default: ""
  AgentCoreRuntimeArn:
    Type: String
    Default: ""
    Description: Leave empty until the AgentCore Runtime is created.
  AgentCoreMemoryArn:
    Type: String
    Default: ""
    Description: Exact ARN of the AgentCore Memory used by the runtime.
  AgentCoreGuardrailId:
    Type: String
    Default: ""
    Description: Exact Amazon Bedrock Guardrail ID used by the AgentCore runtime.
  AgentCoreSessionTokenSecretArn:
    Type: String
    Default: ""
    Description: Optional Secrets Manager ARN for SESSION_TOKEN_SECRET when AgentCore tools need menu-link token creation.
  FrontendCorsOrigins:
    Type: String
    AllowedPattern: "^(?!\\*$)(?!.*localhost)(?!.*127\\.0\\.0\\.1)(?!.*,).+$"
    Description: Single exact frontend origin. Do not use a wildcard.
  SessionTokenSecretArn:
    Type: String
    Default: ""
  AgentfloWhatsAppWebhookSecretArn:
    Type: String
    Default: ""
    Description: Optional Secrets Manager ARN for the Agentflo WhatsApp webhook shared secret.
  AgentfloGatewayBaseUrl:
    Type: String
    Default: https://communicationgateway.agentflo.com
  AgentfloGatewayTenantId:
    Type: String
    Default: fyp-dev
  AgentfloGatewayAgentId:
    Type: String
    Default: restaurant-agent
  AgentfloGatewayActorId:
    Type: String
    Default: restaurant-agent
  AgentfloGatewayApiKeySecretArn:
    Type: String
    Default: ""
    Description: Optional Secrets Manager ARN for the Agentflo Communication Gateway API key.
  AdminUsername:
    Type: String
    Default: ""
  AdminPasswordSecretArn:
    Type: String
    Default: ""
  AdminSessionSecretArn:
    Type: String
    Default: ""

Conditions:
  HasBackendImageUri: !Not [!Equals [!Ref BackendImageUri, ""]]
  ShouldCreateAgentRequestsTable: !Equals [!Ref CreateAgentRequestsTable, "true"]
  ShouldCreateConversationMessagesTable: !Equals [!Ref CreateConversationMessagesTable, "true"]
  ShouldCreateTicketsTable: !Equals [!Ref CreateTicketsTable, "true"]
  HasAgentCoreRuntimeArn: !Not [!Equals [!Ref AgentCoreRuntimeArn, ""]]
  HasAgentCoreMemoryArn: !Not [!Equals [!Ref AgentCoreMemoryArn, ""]]
  HasAgentCoreSessionTokenSecret: !Not [!Equals [!Ref AgentCoreSessionTokenSecretArn, ""]]
  HasKnowledgeBaseId: !Not [!Equals [!Ref KnowledgeBaseId, ""]]
  HasSessionTokenSecret: !Not [!Equals [!Ref SessionTokenSecretArn, ""]]
  HasAgentfloWhatsAppWebhookSecret: !Not [!Equals [!Ref AgentfloWhatsAppWebhookSecretArn, ""]]
  HasAgentfloGatewayApiKeySecret: !Not [!Equals [!Ref AgentfloGatewayApiKeySecretArn, ""]]
  HasAdminPasswordSecret: !Not [!Equals [!Ref AdminPasswordSecretArn, ""]]
  HasAdminSessionSecret: !Not [!Equals [!Ref AdminSessionSecretArn, ""]]
  HasAgentCoreGuardrailId: !Not [!Equals [!Ref AgentCoreGuardrailId, ""]]
  HasVoiceTranscribeRoleArn: !Not [!Equals [!Ref VoiceTranscribeRoleArn, ""]]
  IsWhatsAppVoiceReplyEnabled: !Equals [!Ref WhatsAppVoiceReplyEnabled, "true"]

Resources:
  BackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${ProjectName}-backend
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  AgentRuntimeRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${ProjectName}-agent-runtime
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${ProjectName}/backend
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  WhatsAppVoiceWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${ProjectName}/whatsapp-voice-worker
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  BackendApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/${ProjectName}/backend-http-api
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  VoiceMediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub ${ProjectName}-voice-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteTemporaryVoiceInput
            Status: Enabled
            Prefix: voice-input/
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: DataClassification
          Value: temporary-customer-audio

  VoiceMediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref VoiceMediaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt VoiceMediaBucket.Arn
              - !Sub ${VoiceMediaBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - !If
            - HasVoiceTranscribeRoleArn
            - Sid: AllowConfiguredTranscribeRoleToListVoiceInput
              Effect: Allow
              Principal:
                AWS: !Ref VoiceTranscribeRoleArn
              Action:
                - s3:ListBucket
              Resource: !GetAtt VoiceMediaBucket.Arn
              Condition:
                StringLike:
                  s3:prefix: voice-input/*
            - !Ref AWS::NoValue
          - !If
            - HasVoiceTranscribeRoleArn
            - Sid: AllowConfiguredTranscribeRoleToReadVoiceInput
              Effect: Allow
              Principal:
                AWS: !Ref VoiceTranscribeRoleArn
              Action:
                - s3:GetObject
              Resource: !Sub ${VoiceMediaBucket.Arn}/voice-input/*
            - !Ref AWS::NoValue

  VoiceProcessingDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-whatsapp-voice-processing-dlq
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  VoiceProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-whatsapp-voice-processing
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 86400
      VisibilityTimeout: 300
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt VoiceProcessingDeadLetterQueue.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${ProjectName}-backend
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  VpcLinkSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${ProjectName} API Gateway VPC Link egress to ECS backend
      VpcId: !Ref VpcId
      SecurityGroupEgress: []
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-apigw-vpc-link
        - Key: Project
          Value: !Ref ProjectName

  BackendTaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${ProjectName} ECS backend tasks
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-backend-tasks
        - Key: Project
          Value: !Ref ProjectName

  WhatsAppVoiceWorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${ProjectName} WhatsApp voice worker tasks with no ingress
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-whatsapp-voice-worker-tasks
        - Key: Project
          Value: !Ref ProjectName

  BackendIngressFromVpcLink:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref BackendTaskSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref BackendContainerPort
      ToPort: !Ref BackendContainerPort
      SourceSecurityGroupId: !Ref VpcLinkSecurityGroup

  VpcLinkEgressToBackend:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref VpcLinkSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref BackendContainerPort
      ToPort: !Ref BackendContainerPort
      DestinationSecurityGroupId: !Ref BackendTaskSecurityGroup

  PrivateNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: !Sub ${ProjectName}.local
      Vpc: !Ref VpcId
      Description: !Sub Private namespace for ${ProjectName} services.
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  BackendDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: backend
      NamespaceId: !Ref PrivateNamespace
      Description: !Sub Cloud Map service for ${ProjectName} FastAPI backend.
      DnsConfig:
        DnsRecords:
          - Type: SRV
            TTL: 10
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-ecs-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  EcsTaskExecutionBasePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${ProjectName}-ecs-execution-base
      Roles:
        - !Ref EcsTaskExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EcrAuthorizationToken
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
            Resource: "*"
          - Sid: PullBackendImage
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Resource: !GetAtt BackendRepository.Arn
          - Sid: WriteBackendContainerLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${ProjectName}/backend:log-stream:*

  EcsTaskExecutionSessionSecretPolicy:
    Type: AWS::IAM::Policy
    Condition: HasSessionTokenSecret
    Properties:
      PolicyName: !Sub ${ProjectName}-ecs-execution-session-secret
      Roles:
        - !Ref EcsTaskExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Ref SessionTokenSecretArn

  EcsTaskExecutionAgentfloWhatsAppWebhookSecretPolicy:
    Type: AWS::IAM::Policy
    Condition: HasAgentfloWhatsAppWebhookSecret
    Properties:
      PolicyName: !Sub ${ProjectName}-ecs-execution-agentflo-whatsapp-webhook-secret
      Roles:
        - !Ref EcsTaskExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Ref AgentfloWhatsAppWebhookSecretArn

  EcsTaskExecutionAgentfloGatewayApiKeyPolicy:
    Type: AWS::IAM::Policy
    Condition: HasAgentfloGatewayApiKeySecret
    Properties:
      PolicyName: !Sub ${ProjectName}-ecs-execution-agentflo-gateway-api-key
      Roles:
        - !Ref EcsTaskExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Ref AgentfloGatewayApiKeySecretArn

  EcsTaskExecutionAdminPasswordPolicy:
    Type: AWS::IAM::Policy
    Condition: HasAdminPasswordSecret
    Properties:
      PolicyName: !Sub ${ProjectName}-ecs-execution-admin-password
      Roles:
        - !Ref EcsTaskExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Ref AdminPasswordSecretArn

  EcsTaskExecutionAdminSessionPolicy:
    Type: AWS::IAM::Policy
    Condition: HasAdminSessionSecret
    Properties:
      PolicyName: !Sub ${ProjectName}-ecs-execution-admin-session
      Roles:
        - !Ref EcsTaskExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Ref AdminSessionSecretArn

  WhatsAppVoiceWorkerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-voice-worker-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  WhatsAppVoiceWorkerExecutionBasePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${ProjectName}-voice-worker-execution-base
      Roles:
        - !Ref WhatsAppVoiceWorkerExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EcrAuthorizationToken
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
            Resource: "*"
          - Sid: PullBackendImage
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Resource: !GetAtt BackendRepository.Arn
          - Sid: WriteWorkerContainerLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${ProjectName}/whatsapp-voice-worker:log-stream:*

  WhatsAppVoiceWorkerExecutionSessionSecretPolicy:
    Type: AWS::IAM::Policy
    Condition: HasSessionTokenSecret
    Properties:
      PolicyName: !Sub ${ProjectName}-voice-worker-session-secret
      Roles:
        - !Ref WhatsAppVoiceWorkerExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Ref SessionTokenSecretArn

  WhatsAppVoiceWorkerExecutionGatewaySecretPolicy:
    Type: AWS::IAM::Policy
    Condition: HasAgentfloGatewayApiKeySecret
    Properties:
      PolicyName: !Sub ${ProjectName}-voice-worker-gateway-secret
      Roles:
        - !Ref WhatsAppVoiceWorkerExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Ref AgentfloGatewayApiKeySecretArn

  WhatsAppVoiceWorkerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-voice-worker-app
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  WhatsAppVoiceWorkerDynamoDbPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${ProjectName}-voice-worker-dynamodb
      Roles:
        - !Ref WhatsAppVoiceWorkerTaskRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadAndUpdateVoiceJobs
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:UpdateItem
            Resource: !GetAtt WhatsAppVoiceJobsTable.Arn
          - Sid: RecoverVoiceOutbox
            Effect: Allow
            Action:
              - dynamodb:Query
            Resource: !Sub ${WhatsAppVoiceJobsTable.Arn}/index/DueJobsIndex
          - Sid: PersistAgentRequests
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
            Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgentRequestsTableName}
          - Sid: PersistConversationHistory
            Effect: Allow
            Action:
              - dynamodb:PutItem
            Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConversationMessagesTableName}
          - Sid: ResolveAndPersistCustomers
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
            Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CustomersTableName}
          - Sid: ResolveCustomersByPhone
            Effect: Allow
            Action:
              - dynamodb:Query
            Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CustomersTableName}/index/GSI1
          - Sid: ResolveAndPersistAgentSessions
            Effect: Allow
